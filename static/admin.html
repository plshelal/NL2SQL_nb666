<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>金融问数 · 用户管理</title>
<style>
:root { --primary: #1e40af; --primary-light: #3b82f6; --bg: #f1f5f9; --surface: #fff; --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0; --success: #059669; --danger: #dc2626; --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,.06); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; height: 52px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.header .logo { font-weight: 700; font-size: 16px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
.header .logo .dot { width: 8px; height: 8px; background: var(--primary-light); border-radius: 50%; }
.header .user-info { display: flex; align-items: center; gap: 12px; font-size: 13px; }
.header .user-info button { background: none; border: 1px solid var(--border); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--text-secondary); text-decoration: none; }
.header .user-info button:hover { color: var(--primary); border-color: var(--primary-light); }
.login-page { display: flex; align-items: center; justify-content: center; height: 100vh; }
.login-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 40px; width: 400px; max-width: 90vw; }
.login-card h1 { font-size: 22px; margin-bottom: 4px; color: var(--primary); }
.login-card .sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; }
.login-card label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; color: var(--text-secondary); }
.login-card input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
.login-card input:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
.login-card button { width: 100%; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; margin-top: 20px; background: var(--primary); color: #fff; }
.login-card button:hover { background: #1e3a8a; }
.login-card .msg { color: var(--danger); font-size: 13px; margin-top: 8px; text-align: center; }
.denied { text-align: center; padding: 80px 20px; color: var(--danger); font-size: 16px; }
.denied a { color: var(--primary); }
.content { flex: 1; overflow-y: auto; padding: 22px 26px; }
.toolbar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
.btn { padding: 8px 16px; border-radius: 7px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; background: var(--primary); color: #fff; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.btn:hover { background: #1e3a8a; }
.btn.ghost { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); }
.btn.ghost:hover { color: var(--primary); border-color: var(--primary-light); }
.btn.sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; }
.btn.ok { background: var(--success); }
.btn.no { background: var(--surface); color: var(--danger); border: 1px solid #fecaca; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; font-size: 13px; box-shadow: var(--shadow); }
th { background: #f8fafc; padding: 10px 12px; text-align: left; border-bottom: 2px solid var(--border); font-size: 12px; color: var(--text-secondary); position: sticky; top: 0; }
td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:hover { background: #f8fafc; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; background: #eff6ff; color: var(--primary); }
.badge.gray { background: #f1f5f9; color: var(--text-secondary); }
.badge.lock { background: #fef2f2; color: var(--danger); }
.modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.4); display: none; align-items: center; justify-content: center; z-index: 100; }
.modal-bg.show { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius); box-shadow: 0 4px 20px rgba(0,0,0,.15); padding: 24px; width: 520px; max-width: 90vw; max-height: 80vh; overflow-y: auto; }
.modal h2 { font-size: 17px; margin-bottom: 16px; color: var(--primary); }
.form-row { margin-bottom: 14px; }
.form-row label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.form-row input, .form-row select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; }
.form-row input:focus, .form-row select:focus { border-color: var(--primary-light); }
.ind-picker { border: 1px solid var(--border); border-radius: 8px; max-height: 200px; overflow-y: auto; }
.ind-item { display: flex; align-items: center; gap: 8px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
.ind-item:hover { background: #f1f5f9; }
.ind-item input { accent-color: var(--primary); }
.toast { position: fixed; top: 20px; right: 20px; z-index: 99; padding: 12px 20px; border-radius: 8px; font-size: 13px; color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.15); display: none; }
.toast.ok { background: var(--success); }
.toast.err { background: var(--danger); }
.toast.info { background: var(--primary); }
</style>
</head>
<body>

<div class="login-page" id="page-login" style="display:none">
  <div class="login-card">
    <h1>管理员登录</h1><div class="sub">用户管理 · 金融问数系统</div>
    <div class="msg" id="login-msg" style="display:none"></div>
    <label>用户名</label><input id="login-user">
    <label>密码</label><input id="login-pass" type="password">
    <button onclick="doLogin()">登 录</button>
    <div class="sub" style="margin-top:16px;text-align:center;"><a href="/static/query.html" style="color:var(--primary);cursor:pointer;">返回问数系统</a></div>
  </div>
</div>

<div class="denied" id="page-denied" style="display:none">🔒 仅管理员可访问用户管理<br><br><a href="/static/query.html">返回问数系统</a></div>

<div id="app" style="display:none;height:100vh;flex-direction:column;">
  <header class="header">
    <div class="logo"><span class="dot"></span>用户管理</div>
    <div class="user-info">
      <span id="h-username"></span>
      <a href="/static/knowledge.html" style="background:#eff6ff;color:var(--primary);padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none;">📚 知识管理</a>
      <a href="/static/audit.html" style="background:#eff6ff;color:var(--primary);padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none;">📋 审计日志</a>
      <a href="/static/query.html" style="border:1px solid var(--border);padding:6px 14px;border-radius:6px;font-size:12px;color:var(--text-secondary);text-decoration:none;">返回问数</a>
      <button onclick="doLogout()">退出</button>
    </div>
  </header>
  <div class="content">
    <div class="toolbar">
      <button class="btn" onclick="loadUsers()">刷新</button>
      <span id="stats" style="font-size:13px;color:var(--text-secondary);"></span>
    </div>
    <table>
      <thead><tr><th>ID</th><th>用户名</th><th>密码哈希</th><th>职级</th><th>岗位</th><th>机构</th><th>可查机构</th><th>权限指标数</th><th>操作</th></tr></thead>
      <tbody id="user-body"></tbody>
    </table>
  </div>
</div>

<div class="modal-bg" id="edit-modal">
  <div class="modal">
    <h2 id="modal-title">编辑用户</h2>
    <div class="form-row">
      <label>用户名</label>
      <input id="m-username" disabled style="background:#f8fafc;color:var(--text-secondary);">
    </div>
    <div class="form-row">
      <label>职级</label>
      <select id="m-level">
        <option>普通员工</option><option>主管</option><option>部门经理</option><option>行领导</option>
      </select>
    </div>
    <div class="form-row">
      <label>岗位</label>
      <select id="m-position">
        <option>综合管理</option><option>客户经理</option><option>风控专员</option><option>财务人员</option>
      </select>
    </div>
    <div class="form-row">
      <label>所属机构</label>
      <input id="m-org">
    </div>
    <div class="form-row">
      <label>可查机构(逗号分隔,如 A市,B市)</label>
      <input id="m-orgs" placeholder="如: A市,B市,C市">
    </div>
    <div class="form-row">
      <label>重置密码(留空不改)</label>
      <input id="m-password" type="password" placeholder="输入新密码,留空则不改">
    </div>
    <div class="form-row">
      <label>权限指标(<span id="m-ind-count">0</span> 个已选)</label>
      <div class="ind-picker" id="m-indicators"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn ok" onclick="saveUser()">保存</button>
      <button class="btn ghost" onclick="closeModal()">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let token = localStorage.getItem('finance_token') || '';
let users = [], allIndicators = { direct: [], computed: [] };
let editUid = null, selectedIndicators = new Set();

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function toast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast ' + (type||'info'); t.style.display = 'block'; clearTimeout(t._tm); t._tm = setTimeout(()=>t.style.display='none',2600); }
async function api(path, opts) { const r = await fetch(path, Object.assign({headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}}, opts||{})); if(r.status===401){location.reload();throw new Error('登录过期');} return r.json(); }

async function init() {
  if (!token) return showLogin();
  try {
    const d = await api('/api/auth/me');
    if (!d.data) return showLogin();
    const u = d.data.user;
    if (u.username !== 'admin_total') { document.getElementById('page-denied').style.display='block'; return; }
    document.getElementById('h-username').textContent = u.username;
    document.getElementById('app').style.display = 'flex';
    loadIndicators(); loadUsers();
  } catch(e) { showLogin(); }
}
function showLogin() { document.getElementById('page-login').style.display = 'flex'; }
async function doLogin() {
  const u = document.getElementById('login-user').value.trim(), p = document.getElementById('login-pass').value.trim();
  if (!u||!p) return;
  const r = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
  const d = await r.json();
  if (d.code!==0){const m=document.getElementById('login-msg');m.style.display='block';m.textContent=d.message;return;}
  localStorage.setItem('finance_token', d.data.token); location.reload();
}
function doLogout() { localStorage.removeItem('finance_token'); location.reload(); }

async function loadIndicators() {
  allIndicators = await api('/api/admin/indicators');
}

async function loadUsers() {
  users = await api('/api/admin/users');
  const el = document.getElementById('user-body');
  el.innerHTML = users.map(u => `<tr>
    <td>${u.id}</td>
    <td>${esc(u.username)} ${u.is_self?'<span class="badge lock">管理员</span>':''}</td>
    <td style="font-family:Consolas,monospace;font-size:11px;color:var(--text-secondary);max-width:200px;overflow:hidden;text-overflow:ellipsis;">${esc(u.password_hash).slice(0,16)}…</td>
    <td><span class="badge gray">${esc(u.level)}</span></td>
    <td>${esc(u.position)}</td>
    <td>${esc(u.org_name)}</td>
    <td style="font-size:12px;color:var(--text-secondary);">${u.allowed_orgs.map(esc).join(', ')||'—'}</td>
    <td>${u.indicators.length}</td>
    <td>${u.is_self ? '<span class="badge lock">不可改</span>' : `<button class="btn sm" onclick="editUser(${u.id})">编辑</button> <button class="btn sm no" onclick="delUser(${u.id})">删除</button>`}</td>
  </tr>`).join('');
  document.getElementById('stats').textContent = `共 ${users.length} 个用户`;
}

function editUser(uid) {
  const u = users.find(x => x.id === uid);
  if (!u) return;
  editUid = uid;
  selectedIndicators = new Set(u.indicators);
  document.getElementById('modal-title').textContent = `编辑用户 · ${u.username}`;
  document.getElementById('m-username').value = u.username;
  document.getElementById('m-level').value = u.level;
  document.getElementById('m-position').value = u.position;
  document.getElementById('m-org').value = u.org_name;
  document.getElementById('m-orgs').value = u.allowed_orgs.join(',');
  document.getElementById('m-password').value = '';
  // 指标列表
  const all = [...(allIndicators.direct||[]).map(n=>({n,t:'直接'})), ...(allIndicators.computed||[]).map(n=>({n,t:'计算'}))];
  document.getElementById('m-indicators').innerHTML = all.map(i => {
    const checked = selectedIndicators.has(i.n) ? 'checked' : '';
    return `<div class="ind-item"><input type="checkbox" data-ind="${esc(i.n)}" ${checked}> <span class="badge ${i.t==='计算'?'gray':''}" style="font-size:10px;">${i.t}</span> ${esc(i.n)}</div>`;
  }).join('');
  document.getElementById('m-ind-count').textContent = selectedIndicators.size;
  // checkbox 联动
  document.querySelectorAll('#m-indicators input[type=checkbox]').forEach(cb => {
    cb.onchange = () => {
      const ind = cb.dataset.ind;
      cb.checked ? selectedIndicators.add(ind) : selectedIndicators.delete(ind);
      document.getElementById('m-ind-count').textContent = selectedIndicators.size;
    };
  });
  document.getElementById('edit-modal').classList.add('show');
}

function closeModal() { document.getElementById('edit-modal').classList.remove('show'); editUid = null; }

async function saveUser() {
  if (!editUid) return;
  const body = {
    level: document.getElementById('m-level').value,
    position: document.getElementById('m-position').value,
    orgs: document.getElementById('m-orgs').value.split(',').map(s=>s.trim()).filter(Boolean),
    indicators: [...selectedIndicators],
  };
  const pw = document.getElementById('m-password').value.trim();
  if (pw) body.password = pw;
  const org = document.getElementById('m-org').value.trim();
  // 机构改了也带上
  body.org = org;
  await api('/api/admin/users/' + editUid, {method:'POST', body:JSON.stringify(body)});
  toast('保存成功', 'ok');
  closeModal(); loadUsers();
}

async function delUser(uid) {
  if (!confirm('确认删除该用户?')) return;
  await api('/api/admin/users/' + uid, {method:'DELETE'});
  toast('已删除', 'ok');
  loadUsers();
}

init();
</script>
</body>
</html>
