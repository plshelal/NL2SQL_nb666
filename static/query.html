<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>金融问数</title>
<style>
:root { --primary: #1e40af; --primary-light: #3b82f6; --bg: #f1f5f9; --surface: #fff; --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0; --success: #059669; --danger: #dc2626; --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,.06); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
.auth-page { display: flex; align-items: center; justify-content: center; height: 100vh; }
.auth-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 40px; width: 400px; max-width: 90vw; }
.auth-card h1 { font-size: 22px; margin-bottom: 4px; color: var(--primary); }
.auth-card .sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; }
.auth-card label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; color: var(--text-secondary); }
.auth-card input, .auth-card select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; }
.auth-card input:focus, .auth-card select:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
.auth-card button { width: 100%; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; margin-top: 20px; background: var(--primary); color: #fff; }
.auth-card button:hover { background: #1e3a8a; }
.auth-card .switch { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-secondary); }
.auth-card .switch a { color: var(--primary); cursor: pointer; font-weight: 600; }
.auth-card .msg { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; }
.auth-card .msg.error { background: #fef2f2; color: var(--danger); }
.auth-card .msg.success { background: #f0fdf4; color: var(--success); }
.app { display: none; height: 100vh; flex-direction: column; }
.app.active { display: flex; }
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; height: 52px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.header .logo { font-weight: 700; font-size: 16px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
.header .logo .ic-logo { width: 20px; height: 20px; color: var(--primary-light); }
/* lucide 图标通用:线性单色,随父色 */
.ic, [data-lucide] { stroke-width: 2; }
.header .user-info { display: flex; align-items: center; gap: 12px; font-size: 13px; }
.header .user-info .badge { background: #eff6ff; color: var(--primary); padding: 3px 10px; border-radius: 12px; font-weight: 600; font-size: 12px; }
.header .user-info .avatar { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; background: #64748b; cursor: default; user-select: none; }
.header .user-info .avatar.admin { background: var(--primary); }
.header .user-info .avatar:hover { box-shadow: 0 0 0 3px rgba(59,130,246,.2); }
.header .user-info button { background: none; border: 1px solid var(--border); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--text-secondary); }
.main { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; transition: width .2s, margin-left .2s; overflow: hidden; }
.sidebar.collapsed { width: 0; margin-left: -1px; border-right: none; }
.sidebar-toggle { position: absolute; left: 260px; top: 50%; transform: translateY(-50%); z-index: 10; width: 20px; height: 36px; background: var(--surface); border: 1px solid var(--border); border-left: none; border-radius: 0 6px 6px 0; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); transition: left .2s; }
.sidebar-toggle:hover { color: var(--primary); }
.sidebar-toggle svg { width: 14px; height: 14px; transition: transform .2s; }
.sidebar.collapsed + .sidebar-toggle { left: 0; }
.sidebar.collapsed + .sidebar-toggle svg { transform: rotate(180deg); }
.sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.sidebar-header button { width: 100%; padding: 9px; border: 1px dashed var(--border); border-radius: 8px; background: none; cursor: pointer; font-size: 13px; color: var(--primary); font-weight: 600; }
.sidebar-header button:hover { background: #f8fafc; }
.conv-list { flex: 1; overflow-y: auto; padding: 8px; }
.conv-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; }
.conv-item:hover { background: #f8fafc; }
.conv-item.active { background: #eff6ff; color: var(--primary); font-weight: 600; }
.conv-item .del { margin-left: auto; color: #94a3b8; font-size: 16px; cursor: pointer; padding: 0 4px; display: none; }
.conv-item:hover .del { display: block; }
.conv-item .del:hover { color: var(--danger); }
.chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.messages { flex: 1; overflow-y: auto; padding: 20px 24px; }
.msg-row { display: flex; margin-bottom: 20px; gap: 10px; }
.msg-row.user { justify-content: flex-end; }
.msg-row .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.msg-row.assistant .avatar { background: #eff6ff; }
.msg-row.user .avatar { background: #e0e7ff; order: 2; }
.msg-row .bubble { max-width: 88%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.7; }
.msg-row.user .bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
.msg-row.assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.bubble .stage-line { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
.bubble .result-table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.bubble .result-table th { background: #f8fafc; font-weight: 600; color: var(--text-secondary); padding: 6px 10px; text-align: left; border-bottom: 2px solid var(--border); font-size: 11px; text-transform: uppercase; }
.bubble .result-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
.bubble .big-number { text-align: center; padding: 12px 0; }
.bubble .big-number .val { font-size: 36px; font-weight: 800; color: var(--primary); }
.bubble .big-number .lbl { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.bubble .chart-wrap { max-height: 320px; margin: 8px 0; }
.bubble .report { background: #f8faff; border-left: 4px solid var(--primary); padding: 10px 14px; margin-top: 10px; border-radius: 0 6px 6px 0; font-size: 13px; line-height: 1.5; color: #334155; }
.bubble .report > div { margin: 2px 0; }
.bubble .report > table { margin: 6px 0; }
.bubble .report br { display: none; }
.bubble .error { background: #fef2f2; color: var(--danger); padding: 8px 12px; border-radius: 6px; font-size: 13px; }
.bubble .state-box { padding: 10px 14px; border-radius: 6px; font-size: 13px; display: flex; align-items: center; gap: 8px; line-height: 1.5; }
.bubble .state-box .icon { font-size: 17px; flex-shrink: 0; }
.bubble .state-box.perm { background: #fef2f2; color: var(--danger); }
.bubble .state-box.missing { background: #eff6ff; color: var(--primary); }
.bubble .state-box.empty { color: var(--text-secondary); }
.bubble .thinking { background:#f8fafc; border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
.bubble .thinking.done { opacity:.6; }
/* 收起态:只显示当前行(最后一条 stage),其余隐藏 */
.bubble .thinking.collapsed .stages { display:block; }
.bubble .thinking.collapsed .stages .stage:not(:last-child) { display:none; }
.bubble .thinking.collapsed .stages .stage:last-child { display:flex; }
.bubble .thinking.collapsed .think-head { margin-bottom:0; }
/* 展开态:限制最多显示 8 行,超出滚动 */
.bubble .thinking:not(.collapsed) .stages { max-height:200px; overflow-y:auto; }
.bubble .think-head { font-size:12px; color:var(--text-secondary); margin-bottom:8px; font-weight:600; display:flex; align-items:center; gap:6px; }
.bubble .think-head.clickable { cursor:pointer; user-select:none; }
.bubble .think-head.clickable:hover { color:var(--primary); }
.bubble .think-head .chev { display:inline-block; width:12px; text-align:center; transition:transform .2s; color:#94a3b8; }
.bubble .thinking:not(.collapsed) .think-head .chev { transform:rotate(90deg); }
.bubble .think-head .dots { display:inline-flex; gap:3px; }
.bubble .think-head .dots span { width:5px; height:5px; border-radius:50%; background:var(--primary-light); animation:blink 1.2s infinite; }
.bubble .think-head .dots span:nth-child(2){ animation-delay:.2s; }
.bubble .think-head .dots span:nth-child(3){ animation-delay:.4s; }
@keyframes blink { 0%,80%,100%{ opacity:.25; } 40%{ opacity:1; } }
.bubble .stages { display:flex; flex-direction:column; gap:4px; }
.bubble .stage { font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:7px; transition:all .25s; }
.bubble .stage.done .stage-icon { color:var(--success); }
.bubble .stage.active { color:var(--primary); font-weight:500; }
.bubble .stage .spinner { display:inline-block; width:11px; height:11px; border:2px solid #bfdbfe; border-top-color:var(--primary); border-radius:50%; animation:spin .65s linear infinite; }
/* lucide 图标尺寸适配 */
.msg-row .avatar svg { width:18px; height:18px; }
.bubble .stage-icon svg { width:12px; height:12px; }
.bubble .stage .stage-emoji { width:13px; height:13px; flex-shrink:0; color:var(--text-secondary); }
.bubble .think-head .chev svg { width:12px; height:12px; transition:transform .2s; display:block; }
.bubble .think-head .chev { display:inline-flex; }
.bubble .state-box .icon svg { width:17px; height:17px; }
.q-ic { width:14px; height:14px; vertical-align:-2px; flex-shrink:0; }
.export-csv svg { width:12px; height:12px; }
@keyframes spin { to { transform:rotate(360deg); } }
.bubble .stage .stage-icon { width:11px; text-align:center; flex-shrink:0; }
.bubble .clarify-box { background:#fffbeb; border:1px solid #fcd34d; border-radius:8px; padding:12px 14px; margin-bottom:8px; }
.bubble .clarify-box .q { font-size:13px; font-weight:600; color:#92400e; margin-bottom:10px; display:flex; gap:6px; align-items:center; }
.bubble .clarify-box .opts { display:flex; flex-wrap:wrap; gap:8px; }
.bubble .clarify-box .opt { padding:7px 14px; border-radius:18px; border:1px solid #f59e0b; background:#fff; color:#92400e; font-size:13px; cursor:pointer; transition:all .15s; }
.bubble .clarify-box .opt:hover { background:#f59e0b; color:#fff; }
.bubble .ext-confirm { background:#f0fdf4; border:1px solid #86efac; border-radius:8px; padding:12px 14px; margin-bottom:8px; }
.bubble .ext-confirm .q { font-size:13px; font-weight:600; color:#166534; margin-bottom:10px; display:flex; gap:6px; align-items:center; }
.bubble .ext-confirm input { width:100%; padding:8px 10px; border:1px solid #86efac; border-radius:6px; font-size:13px; font-family:inherit; outline:none; margin-bottom:10px; }
.bubble .ext-confirm input:focus { border-color:#16a34a; box-shadow:0 0 0 3px rgba(22,163,74,.12); }
.bubble .ext-confirm .row { display:flex; gap:8px; }
.bubble .ext-confirm button { padding:7px 16px; border-radius:6px; border:none; cursor:pointer; font-size:13px; font-weight:600; }
.bubble .ext-confirm .go { background:#16a34a; color:#fff; }
.bubble .ext-confirm .go:hover { background:#15803d; }
.bubble .ext-confirm .skip { background:#fff; color:#64748b; border:1px solid #e2e8f0; }
.bubble .ext-confirm .skip:hover { background:#f8fafc; }
.bubble .note-line { font-size:12px; color:#0369a1; background:#f0f9ff; padding:6px 10px; border-radius:6px; margin-bottom:6px; }
.bubble .ext-badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:#7c2d12; background:#fff7ed; border:1px solid #fdba74; padding:3px 10px; border-radius:12px; margin-bottom:6px; }
.input-row { padding: 10px 24px; border-top: 1px solid var(--border); background: var(--surface); position: relative; }
.input-row .input-main { display: flex; gap: 8px; align-items: flex-end; }
/* 输入框容器:textarea + 底部图标内嵌 */
.input-box { flex: 1; position: relative; border: 1px solid var(--border); border-radius: 12px; background: #fff; transition: border-color .15s; }
.input-box:focus-within { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
.input-box textarea { width: 100%; border: none; background: none; padding: 10px 14px 4px; font-size: 14px; font-family: inherit; resize: none; min-height: 44px; max-height: 120px; outline: none; }
.input-icons { display: flex; gap: 4px; padding: 4px 8px 6px; }
.input-row .send-btn { padding: 10px 22px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; height: 44px; }
.input-row .send-btn:hover { background: #1e3a8a; }
.input-row .send-btn:disabled { background: #93c5fd; }
/* 输入框内图标按钮(深度思考+MCP) */
.input-ico { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 6px; background: none; cursor: pointer; color: #cbd5e1; flex-shrink: 0; transition: all .15s; padding: 0; }
.input-ico:hover { background: #f1f5f9; color: var(--text-secondary); }
.input-ico.on { background: #eff6ff; color: var(--primary); }
.input-ico svg { width: 16px; height: 16px; }
/* MCP 弹窗(输入框上方) */
.mcp-pop { position: absolute; bottom: 52px; left: 24px; width: 260px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.12); z-index: 50; display: none; }
.mcp-pop.show { display: block; }
.mcp-pop-head { padding: 10px 14px; font-size: 12px; font-weight: 700; color: var(--text-secondary); border-bottom: 1px solid var(--border); background: #f8fafc; border-radius: 10px 10px 0 0; }
.mcp-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; }
.mcp-item .mi-info { flex: 1; }
.mcp-item .mi-name { font-size: 13px; font-weight: 600; }
.mcp-item .mi-tools { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
/* 开关组件 */
.swtch { position: relative; width: 34px; height: 20px; flex-shrink: 0; }
.swtch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: relative; z-index: 2; }
.swtch .track { position: absolute; inset: 0; background: #cbd5e1; border-radius: 10px; transition: background .2s; pointer-events: none; }
.swtch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.swtch input:checked ~ .track { background: var(--primary); }
.swtch input:checked ~ .track::after { transform: translateX(14px); }
.suggest-wrap { max-width: 640px; margin: 0 auto; padding: 48px 24px 20px; }
.suggest-wrap .hello { text-align: center; margin-bottom: 28px; }
.suggest-wrap .hello .t { font-size: 22px; font-weight: 700; color: var(--text); }
.suggest-wrap .hello .d { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
.suggest-group { margin-bottom: 16px; }
.suggest-group .g-title { font-size: 12px; color: var(--text-secondary); font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.suggest-group .g-title .g-ico { font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; font-size: 13px; cursor: pointer; color: var(--text); transition: all .15s; }
.chip:hover { border-color: var(--primary-light); color: var(--primary); background: #f0f6ff; }
.export-csv { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--primary); background: #eff6ff; border: 1px solid #bfdbfe; padding: 3px 10px; border-radius: 12px; cursor: pointer; margin-top: 6px; }
.export-csv:hover { background: #dbeafe; }
/* 气泡底部操作栏 */
.bubble .action-bar { display: flex; gap: 6px; margin-top: 8px; padding-top: 6px; border-top: 1px solid #f1f5f9; opacity: .6; transition: opacity .15s; }
.bubble:hover .action-bar { opacity: 1; }
.act-ico { display: inline-flex; align-items: center; padding: 3px; border-radius: 5px; cursor: pointer; color: var(--text-secondary); }
.act-ico:hover { background: #f1f5f9; color: var(--primary); }
.act-ico svg { width: 14px; height: 14px; }
.elapsed { font-size: 11px; color: var(--text-secondary); margin-right: auto; display: inline-flex; align-items: center; gap: 3px; }
.elapsed svg { width: 13px; height: 13px; }
/* 反馈弹框 */
.feedback-modal { position: fixed; inset: 0; background: rgba(15,23,42,.4); display: none; align-items: center; justify-content: center; z-index: 100; }
.feedback-modal.show { display: flex; }
.feedback-box { background: var(--surface); border-radius: var(--radius); box-shadow: 0 8px 30px rgba(0,0,0,.2); padding: 24px; width: 420px; max-width: 90vw; }
.feedback-box h3 { font-size: 16px; margin-bottom: 4px; color: var(--text); }
.feedback-box .sub { font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; }
.feedback-box textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; resize: none; min-height: 80px; outline: none; }
.feedback-box textarea:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
.feedback-box .fb-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.feedback-box button { padding: 8px 18px; border-radius: 7px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
.feedback-box .fb-go { background: var(--primary); color: #fff; }
.feedback-box .fb-go:hover { background: #1e3a8a; }
.feedback-box .fb-cancel { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); }
.toast-copied { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 8px 18px; border-radius: 8px; font-size: 13px; display: none; z-index: 100; }
.toast { position: fixed; top: 20px; right: 20px; z-index: 100; padding: 12px 20px; border-radius: 8px; font-size: 13px; color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.15); display: none; }
.toast.ok { background: var(--success); }
.toast.err { background: var(--danger); }
.toast.info { background: var(--primary); }
</style>
</head>
<body>

<!-- Login -->
<div class="auth-page" id="page-login">
  <div class="auth-card">
    <h1>登录</h1><div class="sub">金融问数系统</div>
    <div class="msg" id="login-msg" style="display:none"></div>
    <label>用户名</label><input id="login-username">
    <label>密码</label><input id="login-password" type="password">
    <button onclick="doLogin()">登 录</button>
    <div class="switch">没有账号？<a onclick="showPage('register')">立即注册</a></div>
  </div>
</div>

<!-- Register -->
<div class="auth-page" id="page-register" style="display:none">
  <div class="auth-card">
    <h1>注册</h1><div class="sub">创建账号</div>
    <div class="msg" id="reg-msg" style="display:none"></div>
    <label>用户名</label><input id="reg-username">
    <label>密码</label><input id="reg-password" type="password">
    <label>所属机构</label><select id="reg-org"><option>A市</option><option>B市</option><option>C市</option><option>D市</option><option>E市</option><option>F市</option><option>G市</option><option>H市</option><option>I市</option><option>J市</option><option>K市</option><option>L市</option><option>M市</option></select>
    <label>岗位</label><select id="reg-position"><option>综合管理</option><option>客户经理</option><option>风控专员</option><option>财务人员</option></select>
    <label>职级</label><select id="reg-level"><option>普通员工</option><option>主管</option><option>部门经理</option><option>行领导</option></select>
    <button onclick="doRegister()">注 册</button>
    <div class="switch">已有账号？<a onclick="showPage('login')">返回登录</a></div>
  </div>
</div>

<!-- Chat -->
<div class="app" id="app-chat">
  <header class="header">
    <div class="logo"><i data-lucide="layout-dashboard" class="ic-logo"></i>金融问数</div>
    <div class="user-info">
      <span id="header-username"></span>
      <span class="avatar" id="header-avatar" title=""></span>
      <a id="link-knowledge" href="/static/knowledge.html" style="background:#eff6ff;color:var(--primary);padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px;"><i data-lucide="book-open" style="width:14px;height:14px;"></i>知识管理</a>

<!-- 反馈弹框 + 复制提示 -->
<div class="toast-copied" id="toast-copied">已复制</div>
<div class="toast" id="toast"></div>

<script>
// === State ===
let token = localStorage.getItem('finance_token') || '';
let userInfo = null;
let conversations = [];
let activeConvId = null;
function storageKey() { return 'finance_chat_' + (userInfo ? userInfo.username : 'anon'); }
function loadConversations() {
  try { conversations = JSON.parse(localStorage.getItem(storageKey()) || '[]'); } catch(e) { conversations = []; }
}
function save() { localStorage.setItem(storageKey(), JSON.stringify(conversations)); localStorage.setItem('finance_token', token); }

// === Auth ===
// 头像:用户名首字,管理员主色蓝;悬停显示身份(行·岗)
function setupAvatar(u) {
  const av = document.getElementById('header-avatar');
  if (!av || !u) return;
  av.textContent = (u.username || '?').charAt(0).toUpperCase();
  av.classList.toggle('admin', u.username === 'admin_total');
  av.title = `${u.org_name || '未知机构'} · ${u.position || '未知岗位'}`;
}
function showPage(p) {
  document.querySelectorAll('.auth-page').forEach(e => e.style.display = 'none');
  document.getElementById('app-chat').classList.toggle('active', p === 'chat');
  if (p !== 'chat') document.getElementById('page-' + p).style.display = 'flex';
}
function showMsg(id, t, type) { const e = document.getElementById(id); e.style.display = 'block'; e.className = 'msg ' + type; e.textContent = t; }
async function doLogin() {
  const u = document.getElementById('login-username').value.trim(), p = document.getElementById('login-password').value.trim();
  if (!u||!p) return showMsg('login-msg','请填写完整','error');
  const r = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
  const d = await r.json();
  if (d.code!==0) return showMsg('login-msg',d.message,'error');
  token=d.data.token; userInfo=d.data.user;
  localStorage.setItem('finance_token',token);
  loadConversations();
  document.getElementById('header-username').textContent=userInfo.username;
  setupAvatar(userInfo);
  const isAdmin = userInfo.username === 'admin_total';
  document.getElementById('link-audit').style.display = isAdmin ? 'inline-flex' : 'none';
  document.getElementById('link-admin').style.display = isAdmin ? 'inline-flex' : 'none';
  const redirect = new URLSearchParams(location.search).get('redirect');
  if (redirect === 'audit') { location.href = '/static/audit.html'; return; }
  showPage('chat'); if(conversations.length===0) newConversation(); else { activeConvId=conversations[0].id; renderAll(); }
}
async function doRegister() {
  const u=document.getElementById('reg-username').value.trim(),p=document.getElementById('reg-password').value.trim();
  const l=document.getElementById('reg-level').value,pos=document.getElementById('reg-position').value,org=document.getElementById('reg-org').value;
  if(!u||!p) return showMsg('reg-msg','请填写完整','error');
  const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,level:l,position:pos,org_name:org})});
  const d=await r.json();
  if(d.code!==0) return showMsg('reg-msg',d.message,'error');
  showMsg('reg-msg','注册成功','success'); setTimeout(()=>showPage('login'),800);
}
function doLogout(){ token=''; userInfo=null; localStorage.removeItem('finance_token'); showPage('login'); }
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('collapsed');
  setTimeout(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); }, 50);
}

// === Toggle chips (外部数据 / 深度思考) ===
let _deepThinking = false;
let _mcpStates = {};  // {连接名: bool}

// 深度思考开关(输入框内图标)
function toggleThink() {
  _deepThinking = !_deepThinking;
  document.getElementById('btn-think').classList.toggle('on', _deepThinking);
  refreshIcons();
}

// MCP 弹窗:点击图标展开,加载已配置的外部数据源列表
async function toggleMcpPop(e) {
  if (e) e.stopPropagation();
  const pop = document.getElementById('mcp-pop');
  if (pop.classList.contains('show')) { pop.classList.remove('show'); return; }
  pop.classList.add('show');
  const list = document.getElementById('mcp-list');
  list.innerHTML = '<div style="padding:14px;font-size:12px;color:#94a3b8;">加载中…</div>';
  try {
    const r = await fetch('/api/tools/mcp', { headers: { 'Authorization': 'Bearer ' + token } });
    const d = await r.json();
    if (!d.length) { list.innerHTML = '<div style="padding:14px;font-size:12px;color:#94a3b8;">暂无已配置数据源</div>'; return; }
    list.innerHTML = d.map(m => {
      const checked = _mcpStates[m.name] ? 'checked' : '';
      const tools = (m.tools || []).map(t => `<span class="mi-tools">${esc(t.label)}</span>`).join('');
      return `<div class="mcp-item"><div class="mi-info"><div class="mi-name">${esc(m.name)}</div>${tools}</div>
        <label class="swtch"><input type="checkbox" ${checked} onchange="onMcpToggle('${esc(m.name)}', this.checked)"><span class="track"></span></label></div>`;
    }).join('');
    refreshIcons();
  } catch (e) { list.innerHTML = '<div style="padding:14px;font-size:12px;color:#dc2626;">加载失败</div>'; }
}

function onMcpToggle(name, on) {
  _mcpStates[name] = on;
  // 有任意一个 MCP 开启 = external_enabled
  const anyOn = Object.values(_mcpStates).some(v => v);
  document.getElementById('btn-mcp').classList.toggle('on', anyOn);
  updateInputTip();
  refreshIcons();
}

// 输入框占位提示:外部数据源未开时提醒先开开关;用户一旦输入,浏览器原生 placeholder 自动消失
function updateInputTip() {
  const anyOn = Object.values(_mcpStates).some(v => v);
  document.getElementById('query-input').placeholder =
    anyOn ? '输入业务问题，Enter 发送' : '提问外部数据相关问题，请先打开外部数据源';
}

// 点外部关闭 MCP 弹窗
document.addEventListener('click', e => {
  const pop = document.getElementById('mcp-pop');
  const btn = document.getElementById('btn-mcp');
  if (pop && pop.classList.contains('show') && !pop.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
    pop.classList.remove('show');
  }
});

// === Conversations ===
function newConversation() {
  const c = { id: Date.now().toString(), title: '新对话', messages: [] };
  conversations.unshift(c); activeConvId = c.id; save(); renderAll();
}
function getConv() { return conversations.find(c => c.id === activeConvId); }
function switchConv(id) { activeConvId = id; renderAll(); }
function deleteConv(id) {
  const wasActive = activeConvId === id;
  conversations = conversations.filter(c => c.id !== id);
  if (wasActive) activeConvId = conversations.length > 0 ? conversations[0].id : null;
  save();
  renderConvList();           // 列表总更新
  if (wasActive) renderMessages();  // 只在删当前对话时才重渲染消息+图表
}

// === Render ===
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function toast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast ' + (type || 'info'); t.style.display = 'block'; clearTimeout(t._tm); t._tm = setTimeout(() => t.style.display = 'none', 2600); }

// emoji → lucide 映射(后端 stage 前缀 emoji,渲染时换正式图标;渲染后需 createIcons)
const EMOJI_ICONS = {
  '💭': 'message-square', '🔧': 'wrench', '📡': 'satellite', '✅': 'check', '✓': 'check',
  '⚠️': 'triangle-alert', '❓': 'circle-help', '🚫': 'ban', '💡': 'lightbulb',
  '🌐': 'globe', 'ℹ️': 'info', '⬇': 'download', '❌': 'x', '📝': 'file-text',
};
function iconize(s) {
  const out = esc(s);
  for (const [em, ic] of Object.entries(EMOJI_ICONS)) {
    if (out.startsWith(em)) return `<i data-lucide="${ic}" class="stage-emoji"></i>` + out.slice(em.length);
  }
  return out;
}
// 渲染后统一调用:把所有 <i data-lucide> 替换为 svg 图标
function refreshIcons() { try { if (window.lucide) lucide.createIcons(); } catch(e) {} }

// 行内 md 渲染(只处理 **加粗**,用于按钮等紧凑场景;完整渲染用 mdLite)
function mdInline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }

// 轻量 markdown 渲染(模型输出常含 md 表格/加粗/列表;只做安全子集,不引库)
// 支持: 表格 |a|b|、**加粗**、- 列表、### 小标题、换行
function mdLite(s) {
  if (!s) return '';
  const lines = String(s).split(/\r?\n/);
  let out = [], tableRows = [];
  const flushTable = () => {
    if (!tableRows.length) return;
    const rows = tableRows.filter(r => !/^\|[\s:|-]+\|?$/.test(r.trim()));
    if (rows.length) {
      // 单元格也做 **加粗** 替换(esc 不处理 *,需在 esc 后手动替换)
      const cell = c => esc(c.trim()).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|');
      const head = cells(rows[0]);
      out.push('<table class="result-table"><thead><tr>' + head.map(h => `<th>${cell(h)}</th>`).join('') + '</tr></thead><tbody>');
      rows.slice(1).forEach(r => { out.push('<tr>' + cells(r).map(c => `<td>${cell(c)}</td>`).join('') + '</tr>'); });
      out.push('</tbody></table>');
    }
    tableRows = [];
  };
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (/^\s*\|.*\|\s*$/.test(line)) { tableRows.push(line); continue; }
    // 容忍表格内部的空行(flash 常在表格行间插空行):表已开始且遇空行→跳过不结束表格,
    // 否则一张表被拆成多张小表,各自带 margin 视觉上就是"表格前后一堆空行"(2026-08-18 根因)
    if (!line.trim() && tableRows.length) continue;
    flushTable();
    // md 语义:空行只是块分隔,不产生输出——连续空行不叠加 <br>(否则标题和表格间一长串空行)
    if (!line.trim()) continue;
    let h = esc(line);
    h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if (/^#{1,4}\s+/.test(h)) { h = `<div style="font-weight:600;margin-top:6px;">${h.replace(/^#{1,4}\s+/, '')}</div>`; }
    else if (/^\s*[-*]\s+/.test(h)) { h = `<div style="padding-left:14px;text-indent:-10px;">• ${h.replace(/^\s*[-*]\s+/, '')}</div>`; }
    out.push(h);
  }
  flushTable();
  // 智能拼接:文本之间用 <br>,表格前后不加 <br>(表格自带 margin,加了会留大空行)
  let result = '';
  for (let j = 0; j < out.length; j++) {
    const cur = out[j];
    if (j > 0) {
      const prev = out[j-1];
      const curIsTable = cur.startsWith('<table');
      const prevIsTable = prev.endsWith('</table>');
      if (!curIsTable && !prevIsTable) result += '<br>';
    }
    result += cur;
  }
  return result;
}

function renderResultTable(data) {
  if (!data || !data.length) return '';
  const keys = Object.keys(data[0]);
  let h = '<table class="result-table"><thead><tr>';
  keys.forEach(k => h += `<th>${k}</th>`);
  h += '</tr></thead><tbody>';
  data.forEach(r => { h += '<tr>'; keys.forEach(k => h += `<td>${r[k]!==null?r[k]:'-'}</td>`); h += '</tr>'; });
  h += '</tbody></table>'; return h;
}

// CSV 导出:BOM+UTF-8 保证 Excel 中文不乱码;文件名取首行可读信息
function exportCSV(rows, idx) {
  if (!rows || !rows.length) return;
  const keys = Object.keys(rows[0]);
  const escCell = v => {
    const s = v === null || v === undefined ? '' : String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [keys.map(escCell).join(',')];
  rows.forEach(r => lines.push(keys.map(k => escCell(r[k])).join(',')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  // 文件名:取前两列值拼接(通常是 机构/日期 或 日期/指标),无则用"查询结果"
  const first = rows[0];
  const nameSrc = keys.slice(0, 2).map(k => String(first[k] || '').replace(/[\\/:*?"<>|\s]/g, '')).filter(Boolean).join('_') || '查询结果';
  a.download = nameSrc + '.csv';
  a.href = url;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// === 气泡操作栏:复制/删除/反馈 ===
function copyAnswer(i) {
  const conv = getConv(); const m = conv && conv.messages[i];
  if (!m) return;
  const txt = m.final_answer || (m.result ? JSON.stringify(m.result, null, 2) : '') || m.report || '';
  navigator.clipboard.writeText(txt).then(() => {
    const t = document.getElementById('toast-copied');
    t.style.display = 'block'; clearTimeout(t._tm);
    t._tm = setTimeout(() => t.style.display = 'none', 1500);
  });
}
function confirmDelete(i) {
  const conv = getConv(); if (!conv) return;
  if (!confirm('删除这条对话?')) return;
  conv.messages.splice(i, 1);
  save(); renderMessages(); renderConvList();
}
let _fbIdx = null;
function openFeedback(i) {
  const conv = getConv(); const m = conv && conv.messages[i];
  if (m && m.feedbackSent) { toast('该回答已反馈过', 'info'); return; }
  _fbIdx = i;
  document.getElementById('fb-text').value = '';
  document.getElementById('feedback-modal').classList.add('show');
  setTimeout(() => document.getElementById('fb-text').focus(), 50);
}
function closeFeedback() {
  document.getElementById('feedback-modal').classList.remove('show');
  _fbIdx = null;
}
async function submitFeedback() {
  try {
    const conv = getConv();
    const m = conv && conv.messages[_fbIdx];
    if (!m) { toast('消息不存在', 'err'); return; }
    const txt = document.getElementById('fb-text').value.trim();
    if (!txt) { toast('请输入反馈内容', 'err'); return; }
    if (!m.log_id) { toast('该消息无法关联反馈(旧消息)', 'err'); return; }
    const r = await fetch('/api/query/feedback', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ log_id: m.log_id, feedback: txt })
    });
    const d = await r.json();
    if (d.code === 0) { m.feedbackSent = true; save(); toast('反馈已提交,感谢', 'ok'); }
    else toast(d.message || '提交失败', 'err');
  } catch (e) { toast('提交失败: ' + e, 'err'); }
  finally { closeFeedback(); }
}
function renderThinking(m, i, thinkingOnly) {
  if (!m.stages || !m.stages.length) return '';
  const done = thinkingOnly ? false : (m.result !== null && m.result !== undefined || m.error || m.perm_rejected || m.missing_info || m.clarification || m.external_confirm || m.final_answer);
  // 默认收起(只显示当前行);thinkingOnly 时也收起(只显示最新一行+转圈)
  const collapsed = !m.thinkOpen;
  const head = done
    ? `<div class="think-head clickable" onclick="toggleThinking(${i}, this)"><span class="chev"><i data-lucide="chevron-right"></i></span>思考完成(${m.stages.length}步)</div>`
    : `<div class="think-head clickable" onclick="toggleThinking(${i}, this)"><span class="chev"><i data-lucide="chevron-right"></i></span>思考中(${m.stages.length}步)</div>`;
  let body = '<div class="stages">';
  m.stages.forEach((s, idx) => {
    const isLast = idx === m.stages.length - 1;
    const cur = done || !isLast ? 'done' : 'active';
    const icon = (done || !isLast) ? '<i data-lucide="check" class="stage-check"></i>' : '<span class="spinner"></span>';
    body += `<div class="stage ${cur}"><span class="stage-icon">${icon}</span>${iconize(s)}</div>`;
  });
  body += '</div>';
  return `<div class="thinking${done ? ' done' : ''}${collapsed ? ' collapsed' : ''}">${head}${body}</div>`;
}

// 点击思考头部切换展开/收起(只切 CSS 类 + 记状态到消息对象,不重渲染,不碰图表)
function toggleThinking(i, el) {
  const conv = getConv();
  const m = conv && conv.messages[i];
  if (!m) return;
  m.thinkOpen = !m.thinkOpen;
  const t = el.closest('.thinking');
  if (t) t.classList.toggle('collapsed', !m.thinkOpen);
}

// 增量更新最后一条消息(只动最后一行,不碰已有图表,避免重渲染闪烁)
function updateLastBubble(thinkingOnly) {
  const conv = getConv();
  if (!conv || !conv.messages.length) return;
  const i = conv.messages.length - 1;
  const el = document.getElementById('messages');
  const row = el.lastElementChild;
  if (row) row.outerHTML = msgHTML(conv.messages[i], i, thinkingOnly);
  el.scrollTop = el.scrollHeight;
  refreshIcons();
}

// 点选消歧选项:以 refined_query 自动重发
function pickClarify(refined) {
  const input = document.getElementById('query-input');
  input.value = refined;
  sendMessage();
}

// 外部数据确认框:确认查询(携原文二轮) / 仅查内部(携空串二轮)
function sendWithExternal(i, mode) {
  const conv = getConv();
  const m = conv && conv.messages[i];
  if (!m || !m.external_confirm) return;
  // 找到这条助手消息前面的用户问题
  let userQ = '';
  for (let k = i; k >= 0; k--) if (conv.messages[k].role === 'user') { userQ = conv.messages[k].content; break; }
  if (!userQ) return;
  const extQ = mode === 'go' ? (document.getElementById('ext-q-' + i) || {}).value : '';
  doSend(userQ, mode === 'go' ? (extQ || '').trim() : '');
}
function keepExtDraft(i, v) {
  const conv = getConv();
  if (conv && conv.messages[i]) conv.messages[i].external_draft = v;
}

function msgHTML(m, i, thinkingOnly) {
  if (m.role === 'user') return `<div class="msg-row user"><div class="avatar"><i data-lucide="user"></i></div><div class="bubble">${esc(m.content)}</div></div>`;
  let h = `<div class="msg-row assistant"><div class="avatar"><i data-lucide="bot"></i></div><div class="bubble">`;
  // 思考过程(有 stage 时顶部展示)
  h += renderThinking(m, i, thinkingOnly);
  // thinkingOnly 模式:只渲染思考流,不渲染结果数据(防中途表格闪烁)
  if (thinkingOnly) { h += '</div></div>'; return h; }
  // 消歧反问:黄色按钮组(优先级最高,替代一切结果渲染)
  if (m.clarification) {
    const c = m.clarification;
    let opts = '';
    (c.options || []).forEach(o => {
      opts += `<div class="opt" onclick="pickClarify(decodeURIComponent('${encodeURIComponent(o.refined_query)}'))">${esc(o.label)}</div>`;
    });
    h += `<div class="clarify-box"><div class="q"><i data-lucide="circle-help" class="q-ic"></i> ${esc(c.question)}</div><div class="opts">${opts}</div></div>`;
    h += '</div></div>'; return h;
  }
  // 外部数据确认框(已弃用,保留渲染兼容历史会话记录)
  if (m.external_confirm) {
    h += '<div class="note-line"><i data-lucide="globe" class="q-ic"></i> 外部数据已由系统自动查询(此确认框为旧版会话记录)</div>';
    h += '</div></div>'; return h;
  }
  if (m.note) h += `<div class="note-line">ℹ️ ${esc(m.note)}</div>`;
  if (m.external_source) h += `<div class="ext-badge"><i data-lucide="globe" class="q-ic"></i> 外部数据:${esc(m.external_source)}</div>`;
  if (m.error) {
    h += `<div class="error">${esc(m.error)}</div>`;
    h += '</div></div>'; return h;
  }
  if (m.perm_rejected) {
    h += `<div class="state-box perm"><span class="icon"><i data-lucide="ban"></i></span><span>${esc(m.hint || '您无权查询相关数据,已拦截。')}</span></div>`;
    h += '</div></div>'; return h;
  }
  if (m.missing_info) {
    h += `<div class="state-box missing"><span class="icon"><i data-lucide="lightbulb"></i></span><span>${esc(m.hint || '请补充关键查询信息后再试。')}</span></div>`;
    h += '</div></div>'; return h;
  }
  // 顺序拼接:表格(如果有 result)→ 综合文本(含 md 表格)→ 图表(放文本下方,同一蓝气泡内)
  if (m.result !== null && m.result !== undefined && m.result.length > 0) {
    h += renderResultTable(m.result);
    h += `<div class="export-csv" onclick="exportCSV(m_result(${i}))"><i data-lucide="download" style="width:12px;height:12px;"></i> 导出CSV</div>`;
  }
  if (m.perm_filtered) h += '<div style="color:#d97706;font-size:12px;margin-top:4px;display:flex;align-items:center;gap:4px;"><i data-lucide="triangle-alert" style="width:12px;height:12px;"></i>部分数据因权限被过滤</div>';
  if (m.report) h += `<div class="report"><i data-lucide="file-text" class="q-ic"></i> ${mdLite(m.report)}</div>`;
  if (m.final_answer) {
    h += `<div class="report"><i data-lucide="sparkles" class="q-ic"></i> ${mdLite(m.final_answer)}</div>`;
    // 图表放在综合文本下方(同一个蓝气泡内,表格之后)
    if (m._chartData) {
      const c = m._chartData;
      if (c.type === 'number') h += `<div class="big-number" style="margin-top:8px;"><div class="val">${c.value||''}</div><div class="lbl">${c.title||''}</div></div>`;
      else if (c.type && c.type !== 'table' && c.type !== 'none') h += `<div class="chart-wrap" style="margin-top:8px;"><canvas id="chart-${i}"></canvas></div>`;
    }
  }
  // 无任何结果且无思考流:占位
  if ((m.result === null || m.result === undefined) && !m.final_answer && !m.report
      && (!m.stages || !m.stages.length)) {
    h += '<div class="think-head" style="color:#94a3b8;">思考中<span class="dots"><span></span><span></span><span></span></span></div>';
  }
  // 气泡底部操作栏:复制/删除/反馈(有实质内容时才显示)
  if (m.final_answer || (m.result && m.result.length)) {
    const _el = m.elapsed != null ? `<span class="elapsed"><i data-lucide="timer"></i> ${m.elapsed}s</span>` : '';
    h += `<div class="action-bar">
      ${_el}
      <span class="act-ico" onclick="copyAnswer(${i})" title="复制"><i data-lucide="copy"></i></span>
      <span class="act-ico" onclick="confirmDelete(${i})" title="删除"><i data-lucide="trash-2"></i></span>
      <span class="act-ico" onclick="openFeedback(${i})" title="反馈"><i data-lucide="message-square-plus"></i></span>
    </div>`;
  }
  h += '</div></div>'; return h;
}

function renderAll() {
  renderConvList(); renderMessages();
}

function renderConvList() {
  const el = document.getElementById('conv-list');
  if (!conversations.length) { el.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;">暂无对话</div>'; return; }
  el.innerHTML = conversations.map(c => `<div class="conv-item${c.id===activeConvId?' active':''}" onclick="switchConv('${c.id}')">${c.title}<span class="del" onclick="event.stopPropagation();deleteConv('${c.id}')">×</span></div>`).join('');
}

// 示例问题(点击即发送;日期均在数据区间 2024-12-31~2026-04-30 内)
// 外部/结合类选真实业务视角:LPR 影响净息差、房价关联按揭/不良、降准影响投放成本

  { title: '行内指标', ico: 'landmark', items: [
    'A市农商行2026年3月31日不良贷款率是多少',
    '对比A市和B市农商行2025年12月31日的净利润',
    'E市农商行2026年3月31日存贷比是多少'] },
  { title: '外部数据', ico: 'globe', items: [
    'LPR 2024年1月至2025年12月降了多少',
    '2025年有哪些地产政策',
    '江苏省经济形势怎么样'] },
  { title: '内外结合', ico: 'link', items: [
    'A市农商行2025年1月至12月净利息收入走势如何，这段时间LPR走势如何',
    'B市农商行2025年7月至12月个人贷款余额有变化吗，这段时间房地产政策如何',
    '对比13家农商行2025年12月31日不良贷款率，再看看江苏经济形势'] },
  { title: '更多问题', ico: 'lightbulb', items: [

    '从效益角度分析A市农商行2026年3月31日的指标'] },
];

function renderSuggestions(el) {
  let h = '<div class="suggest-wrap"><div class="hello"><div class="t"><i data-lucide="sparkles" style="width:22px;height:22px;color:var(--primary-light);vertical-align:-4px;"></i> 金融问数</div>'
    + '<div class="d">自然语言查行内指标 / 宏观数据 / 资讯政策，支持内外结合分析</div></div>';
  SUGGESTIONS.forEach(g => {
    h += `<div class="suggest-group"><div class="g-title"><i data-lucide="${g.ico}" style="width:14px;height:14px;"></i>${g.title}</div><div class="chips">`;
    g.items.forEach(q => { h += `<div class="chip" onclick="pickSuggest(this)">${esc(q)}</div>`; });
    h += '</div></div>';
  });
  h += '</div>';
  el.innerHTML = h;
  refreshIcons();
}

function pickSuggest(el) {
  const input = document.getElementById('query-input');
  input.value = el.textContent;
  sendMessage();
}

// 供导出按钮 onclick 取消息结果行(msgHTML 作用域外)
function m_result(i) {
  const conv = getConv();
  return (conv && conv.messages[i] && conv.messages[i].result) || [];
}

function renderMessages() {
  const conv = getConv();
  const el = document.getElementById('messages');
  if (!conv || !conv.messages.length) {
    renderSuggestions(el);
    return;
  }
  el.innerHTML = conv.messages.map((m, i) => msgHTML(m, i)).join('');
  el.scrollTop = el.scrollHeight;
  refreshIcons();
  // 恢复图表
  setTimeout(() => {
    if (typeof Chart === 'undefined') { setTimeout(() => renderMessages(), 200); return; }
    // 注册缩放插件(CDN加载的UMD全局对象)
    try { if (typeof ChartZoom !== 'undefined') Chart.register(ChartZoom); } catch(e) {}
    conv.messages.forEach((m, i) => {
      if (m._chartData && m._chartData.type && m._chartData.type !== 'number' && m._chartData.type !== 'table' && m._chartData.type !== 'none') {
        const cv = document.getElementById('chart-' + i);
        if (cv && !cv._charted) {
          cv._charted = true;
          const c = m._chartData;
          const isBar = c.type === 'bar';
          const zoomOpts = { pan:{enabled:true,mode:'x'}, zoom:{wheel:{enabled:true}, drag:{enabled:true,backgroundColor:'rgba(59,130,246,.08)',borderColor:'#3b82f6',borderWidth:1}, mode:'x'} };
          new Chart(cv, { type:c.type, data:{ labels:c.labels||[], datasets:[{ label:c.title||'', data:c.values||[], backgroundColor:c.type==='pie'?['#1e40af','#7c3aed','#db2777','#ea580c','#059669','#0891b2','#ca8a04','#4f46e5']:'#3b82f6', borderColor:'#1e40af', borderWidth:1 }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{ title:{ display:!!c.title, text:c.title }, legend:{ display:c.type==='pie' }, datalabels:{ anchor:'end', align:'top', font:{size:11}, formatter: v => v }, zoom: c.type==='pie' ? {} : zoomOpts }, scales:c.type!=='pie'?{ x:{ title:{ display:!!c.x_label, text:c.x_label } }, y:{ title:{ display:!!c.y_label, text:c.y_label }, beginAtZero: isBar } }:{} } });
        }
      }
    });
  }, 100);
}

// === Send Message ===
async function sendMessage() {
  const input = document.getElementById('query-input');
  const query = input.value.trim();
  if (!query || !token) return;
  input.value = ''; input.style.height = 'auto';
  doSend(query, null);
}

// doSend:核心发送。externalQuery: null=首轮普通查询; ""=用户选仅内部; 非空=确认框原文
async function doSend(query, externalQuery) {
  if (!query || !token) return;
  document.getElementById('send-btn').disabled = true;

  let conv = getConv();
  if (!conv) { newConversation(); conv = getConv(); }
  if (conv.messages.length === 0) conv.title = query.slice(0, 20) + (query.length > 20 ? '...' : '');

  // 多轮上下文
  let chatCtx = null;
  const hist = conv.messages.filter(m => m.role === 'user' || m.role === 'assistant');
  if (hist.length >= 2) {
    const turns = [];
    for (let i = 0; i < hist.length - 1; i += 2) {
      const u = hist[i], a = hist[i+1];
      if (u && u.role === 'user' && a && a.role === 'assistant')
        turns.push({ question: u.content, answer: (a.result && a.result.length) ? JSON.stringify(a.result).slice(0, 300) : (a.final_answer || a.hint || a.error || '') });
    }
    // 最近3轮 + 强调最后一轮
    chatCtx = { history: turns.slice(-3), last_turn: turns[turns.length - 1] };
  }

  // 添加用户消息 + AI 占位(二轮确认时用户消息为原问题,界面如实呈现)
  conv.messages.push({ role: 'user', content: query });
  const assistMsg = { role: 'assistant', result: null, _chartData: null, report: '', error: '', perm_rejected: false, missing_info: false, perm_filtered: false, hint: '', stages: [], clarification: null, external_confirm: null, note: '', external_source: '', external_kind: '', final_answer: '', log_id: null, elapsed: null, feedbackSent: false };
  conv.messages.push(assistMsg);
  renderAll();

  try {
    const body = { query, chat_context: chatCtx, external_enabled: Object.values(_mcpStates).some(v => v), deep_thinking: _deepThinking };
    if (externalQuery !== null) body.external_query = externalQuery;
    const resp = await fetch('/api/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(body)
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader(), decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n'); buffer = parts.pop() || '';
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        try {
          const data = JSON.parse(line.slice(5).trim());
          if (data.log_id) assistMsg.log_id = data.log_id;
          if (data.stage) { assistMsg.stages.push(data.stage); updateLastBubble(true); }
          if (data.external_confirm) assistMsg.external_confirm = data.external_confirm;
          if (data.clarification) assistMsg.clarification = data.clarification;
          if (data.note) assistMsg.note = data.note;
          if (data.external_source) assistMsg.external_source = data.external_source;
          if (data.external_kind) assistMsg.external_kind = data.external_kind;
          if (data.error) assistMsg.error = data.error;
          if (data.result !== undefined) {
            // 累积:模型可能多次调用行内工具(每家银行查一次),每次透传 result,
            // 后一次会覆盖前一次——累积行而非替换,让用户看到所有银行数据
            if (Array.isArray(data.result) && data.result.length) {
              if (Array.isArray(assistMsg.result)) {
                assistMsg.result = assistMsg.result.concat(data.result);
              } else {
                assistMsg.result = data.result;
              }
            } else {
              assistMsg.result = data.result;
            }
          }
          if (data.perm_rejected) assistMsg.perm_rejected = true;
          if (data.missing_info) assistMsg.missing_info = true;
          if (data.perm_filtered) assistMsg.perm_filtered = true;
          if (data.hint) assistMsg.hint = data.hint;
          if (data.chart) assistMsg._chartData = data.chart;
          if (data.report) assistMsg.report = data.report;
          if (data.final_answer) assistMsg.final_answer = data.final_answer;
          if (data.elapsed != null) assistMsg.elapsed = data.elapsed;
          // result/chart/report/final_answer 只累积不渲染,流结束 renderMessages 一次性画
          // 只有 stage 实时更新思考流(第578行已处理)
        } catch(_) {}
      }
    }
  } catch(err) { assistMsg.error = String(err); }

  // 流结束，统一渲染
  renderMessages();
  save(); renderConvList();
  document.getElementById('send-btn').disabled = false;
}

// (旧版 MCP 浮层已删除,功能合并到输入框 toggle chips)

// === Init ===
const qi = document.getElementById('query-input');
qi.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
qi.addEventListener('input', () => { qi.style.height = 'auto'; qi.style.height = Math.min(qi.scrollHeight, 120) + 'px'; });
updateInputTip();  // 初始:MCP 全关 → 占位提示"先开外部数据源"

if (token) {
  fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(r => r.json()).then(d => {
      if (d.code === 0 && d.data) {
        userInfo = d.data.user;
        document.getElementById('header-username').textContent = userInfo.username;
        setupAvatar(userInfo);
        const _isAdmin = userInfo.username === 'admin_total';
        document.getElementById('link-audit').style.display = _isAdmin ? 'inline-flex' : 'none';
        document.getElementById('link-admin').style.display = _isAdmin ? 'inline-flex' : 'none';
        loadConversations();
        showPage('chat');
        if (conversations.length) { activeConvId = conversations[0].id; renderAll(); }
        else newConversation();
      } else showPage('login');
    }).catch(() => showPage('login'));
} else showPage('login');
